        <use href="#scale" x="40" y="20"/>
        <use href="#scale" x="0" y="40"/>
        <use href="#scale" x="80" y="40"/>
      </g>
    </pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

